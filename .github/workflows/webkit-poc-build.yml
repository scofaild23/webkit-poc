# Build WebKit GTK with the IPC Testing API and run the decidePolicyForResponse PoC.
#
# Everything structural here is carried over from the Firefox PoC workflow, which was debugged to
# the point of actually compiling on a hosted runner:
#   * 24 G swap on /mnt        - the linker and heavy TUs get killed without it (that was exit 143)
#   * source and build on /mnt - / has ~21 GiB free, a WebKit build outgrows it
#   * ccache saved even when the build FAILS - so a rerun resumes instead of starting cold
#   * the first error lines are surfaced, and echoed into a ::error:: annotation, because GitHub
#     requires a signed-in session to read step logs but annotations are public
#
# The control does not need to be written: WebKit ships
# LayoutTests/ipc/decide-policy-for-navigation-action-cross-page-frame.html, added by the very
# commit (e9f94fd4c6) that patched the sibling handlers. Running Apple's own test as the control
# and ours as the attack is the strongest possible framing.

name: WebKit decidePolicyForResponse PoC

on:
  workflow_dispatch:

env:
  SRC: /mnt/wk
  CCACHE_DIR: /mnt/ccache
  CCACHE_MAXSIZE: 12G

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out this repo (the PoC test lives here)
        uses: actions/checkout@v5
        with:
          path: poc

      - name: Prepare the runner — disk, swap, workspace
        run: |
          echo "=== before ==="; free -h; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl vm.swappiness=10
          sudo mkdir -p "$SRC" "$CCACHE_DIR"
          sudo chown -R "$(id -un)" /mnt
          echo "=== after ==="; free -h; df -h / /mnt; swapon --show

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: ccache-wkgtk-v1-${{ github.run_id }}
          restore-keys: ccache-wkgtk-v1-

      - name: Clone WebKit (shallow)
        run: |
          git clone --depth 1 https://github.com/WebKit/WebKit.git "$SRC"
          git -C "$SRC" log -1 --format='%H %ad' --date=short
          # The finding is the ABSENCE of an ownership check here. Record what the tree actually
          # says at build time, so the artifact proves which revision was tested.
          echo "===== decidePolicyForResponse as built ====="
          sed -n '/^void WebPageProxy::decidePolicyForResponse(/,/^}/p' \
            "$SRC/Source/WebKit/UIProcess/WebPageProxy.cpp" | head -20
          echo "===== ownership checks present in this file: ====="
          grep -c "page() == this" "$SRC/Source/WebKit/UIProcess/WebPageProxy.cpp" || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          cd "$SRC"

          # THE ACTUAL CAUSE of exit 100 in runs #1 and #2, per the annotation:
          #
          #   git-svn : Depends: git (< 1:2.43.0-.) but 1:2.54.0-0ppa1~ubuntu24.04.1 is to be installed
          #   E: Unable to correct problems, you have held broken packages.
          #
          # The runner ships git 2.54 from a PPA; Ubuntu 24.04's git-svn pins git < 2.43. The
          # conflict is unsatisfiable, so apt refuses the WHOLE transaction and nothing gets
          # installed — which is also why the build then died in FindGLib.cmake.
          # git-svn sits under the comment "dependencies necessary for using webkit-patch", i.e.
          # the patch-submission workflow, and has nothing to do with building. Drop just that one
          # line; subversion beside it is left alone since it is not what apt objected to.
          sed -i -E '/^\s*git-svn\s*$/d' Tools/glib/dependencies/apt
          echo "===== git-svn removed (expect 0): $(grep -c 'git-svn' Tools/glib/dependencies/apt) ====="

          # The two edits below were a GUESS made before the annotation existed, and they were NOT
          # the cause. They are kept because they are correct anyway — libtiff5-dev genuinely does
          # not exist on 24.04 — but they fixed nothing on their own.
          # Two entries in Tools/gtk/dependencies/apt are stale on Ubuntu 24.04:
          #   libtiff5-dev   -> renamed libtiff-dev after 22.04
          #   x11proto-*-dev -> folded into x11proto-dev; several no longer exist
          # WebKit already has a helper for exactly this situation and uses it further down the
          # same file, so wrap the risky names in aptIfExists rather than deleting them — that
          # keeps the packages if a given release still has them.
          sed -i -E 's/^(\s*)(x11proto-(gl|input|randr|scrnsaver|video|xf86dri)-dev)$/\1$(aptIfExists \2)/' \
            Tools/gtk/dependencies/apt
          sed -i -E 's/^(\s*)libtiff5-dev$/\1$(aptIfExists libtiff5-dev)\n\1$(aptIfExists libtiff-dev)/' \
            Tools/gtk/dependencies/apt
          echo "===== patched entries ====="
          grep -nE "libtiff|x11proto" Tools/gtk/dependencies/apt

          # Non-fatal on purpose: one missing optional package should not cost a whole run before
          # we even learn which package it was. The build step is the real gate.
          set +e
          sudo Tools/gtk/install-dependencies 2>&1 | tee /mnt/deps.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "install-dependencies exit = $rc"
          if [ "$rc" -ne 0 ]; then
            ERR=$(grep -aEi -m 30 'E:|Unable to locate|no installation candidate|not available|Depends:' \
                    /mnt/deps.log | cut -c1-300 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=install-dependencies exit $rc::${ERR:-no apt error lines matched}"
          fi

          sudo apt-get install -y ccache ninja-build xvfb || true
          ccache --version || true
          exit 0

      - name: Install the PoC test into the tree
        run: |
          cp "$GITHUB_WORKSPACE"/poc/LayoutTests/ipc/decide-policy-for-response-cross-page-frame*.* \
             "$SRC/LayoutTests/ipc/"
          ls -la "$SRC/LayoutTests/ipc/" | grep decide-policy
          # The control and its fixture must already exist — if they do not, this WebKit revision
          # predates e9f94fd4c6 and the whole comparison is void.
          test -f "$SRC/LayoutTests/ipc/decide-policy-for-navigation-action-cross-page-frame.html" \
            && echo "CONTROL present" \
            || echo "::error::Control test missing — this tree predates commit e9f94fd4c6."
          test -f "$SRC/LayoutTests/ipc/resources/cross-page-target.html" \
            && echo "fixture present" || echo "::error::resources/cross-page-target.html missing."

      - name: Build WebKit GTK
        id: build
        continue-on-error: true      # a dead build must still save its ccache
        timeout-minutes: 280
        run: |
          ( while true; do
              echo "[mon $(date -u +%H:%M:%S)] $(free -m | awk '/Mem:/{printf "mem_used=%sM avail=%sM",$3,$7}') \
          $(free -m | awk '/Swap:/{printf " swap_used=%sM",$3}') \
          $(df -m /mnt | awk 'NR==2{printf " mnt_free=%sM",$4}')"
              sleep 60
            done ) &
          MON=$!
          cd "$SRC"
          set +e
          # Run #5 built for three hours and then reported `no-ipc`, because -DENABLE_IPC_TESTING_API
          # is NOT a CMake option — CMake listed it under "Manually-specified variables were not used
          # by the project" and carried on. The real gate, from Source/WTF/wtf/PlatformEnable.h:
          #
          #   #if … || (ASSERT_ENABLED && (PLATFORM(GTK) || PLATFORM(WPE)) && COMPILER(GCC))
          #   #define ENABLE_IPC_TESTING_API 1
          #
          # and ASSERT_ENABLED itself is `#ifndef ASSERT_ENABLED / #ifdef NDEBUG → 0`. --release
          # defines NDEBUG, so the API was off by construction. The #ifndef guard means defining it
          # on the command line is the supported override, which keeps the optimised build instead
          # of paying for a full --debug one. WebKit's own comment says GTK+GCC+assertions is what
          # their EWS tests, so this is a supported configuration rather than a hack.
          Tools/Scripts/build-webkit --gtk --release --makeargs="-j3" \
            --cmakeargs="-DDEVELOPER_MODE=ON \
                         -DCMAKE_CXX_FLAGS=-DASSERT_ENABLED=1 \
                         -DENABLE_BUBBLEWRAP_SANDBOX=OFF \
                         -DENABLE_EXPERIMENTAL_FEATURES=OFF \
                         -DENABLE_THUNDER=OFF -DUSE_THUNDER=OFF -DUSE_LIBBACKTRACE=OFF" \
            2>&1 | tee /mnt/build.log
          rc=${PIPESTATUS[0]}
          set -e
          kill $MON 2>/dev/null || true

          # THE CHECK THAT WOULD HAVE SAVED RUN #5's THREE HOURS.
          # CMake only *warns* when a -D flag matches no option, then builds anyway. That warning
          # is the difference between a build that can prove something and one that cannot, so
          # treat it as fatal for the flags we actually depend on.
          if grep -aq "Manually-specified variables were not used by the project" /mnt/build.log; then
            IGN=$(sed -n '/Manually-specified variables were not used/,/^$/p' /mnt/build.log | tr -d ' ')
            echo "===== CMake ignored these -D flags ====="; echo "$IGN"
            echo "::error title=CMake ignored a requested flag::${IGN}"
          fi
          echo "===== first 40 error lines ====="
          grep -naEi -m 40 '(^| )(error|fatal|cannot|undefined reference|no such file)' \
            /mnt/build.log || echo "(no lines matched)"
          echo "===== last 80 lines ====="
          tail -80 /mnt/build.log
          echo "build-webkit exit code = $rc"
          if [ "$rc" -ne 0 ]; then
            ERR=$(grep -aEi -m 25 '(^| )(error|fatal|cannot|undefined reference|no such file)' \
                    /mnt/build.log | cut -c1-300 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-webkit failed (exit $rc)::${ERR:-no error lines matched}"
          fi
          ccache -s || true
          exit $rc

      - name: Save ccache            # runs even when the build died, so reruns resume
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: ccache-wkgtk-v1-${{ github.run_id }}

      - name: Did we get a build?
        id: check
        run: |
          # Latent bug, caught by reading rather than by burning a run: `-name A -o -name B` with
          # -maxdepth repeated mid-expression does not mean what it looks like — -maxdepth is a
          # global option and the -o splits the tests, so the second branch loses -type f. Group the
          # alternation properly. Depth 6 because WebKitGTK lands binaries at
          # WebKitBuild/GTK/Release/bin/.
          BIN=$(find "$SRC/WebKitBuild" -maxdepth 6 -type f \
                  \( -name MiniBrowser -o -name WebKitWebProcess \) 2>/dev/null | head -1)
          echo "search result: ${BIN:-<none>}"
          if [ -n "$BIN" ]; then
            echo "built=yes" >> "$GITHUB_OUTPUT"; ls -lh "$BIN"
            # A binary is not enough — run #5 produced one and still could not test anything.
            # If ENABLE_IPC_TESTING_API compiled in, the IPC testing class names are in the
            # WebProcess binary. Check before spending the test steps on a build that cannot work.
            WP=$(find "$SRC/WebKitBuild" -maxdepth 6 -type f -name "WebKitWebProcess" | head -1)
            N=$(strings "$WP" 2>/dev/null | grep -c "IPCTestingAPI\|IPCStreamTester" || true)
            echo "IPC testing symbols in WebProcess: $N"
            if [ "${N:-0}" -eq 0 ]; then
              echo "::error title=IPC Testing API is NOT in this build::window.IPC will be undefined and both tests will pass or fail vacuously. Check ASSERT_ENABLED reached the compiler."
            fi
          else
            echo "built=no" >> "$GITHUB_OUTPUT"
            echo "::error::No WebKit binaries under $SRC/WebKitBuild — see the [mon ...] lines."
            find "$SRC/WebKitBuild" -maxdepth 3 -type d 2>/dev/null | head -20
          fi

      - name: CONTROL — Apple's own test through a PATCHED handler
        if: steps.check.outputs.built == 'yes'
        continue-on-error: true
        run: |
          cd "$SRC"
          # Expected: rejected by MESSAGE_CHECK, i.e. the WebContent process is terminated.
          Tools/Scripts/run-webkit-tests --gtk --release --display-server=xvfb \
            --no-retry-failures --verbose \
            ipc/decide-policy-for-navigation-action-cross-page-frame.html 2>&1 | tee /mnt/control.log
          echo "===== CONTROL verdict ====="
          grep -iE "crash|pass|fail|timed out" /mnt/control.log | tail -20 || true

      - name: ATTACK — the same forgery through the UNPATCHED handler
        if: steps.check.outputs.built == 'yes'
        continue-on-error: true
        run: |
          cd "$SRC"
          Tools/Scripts/run-webkit-tests --gtk --release --display-server=xvfb \
            --no-retry-failures --no-show-results --verbose \
            ipc/decide-policy-for-response-cross-page-frame.html 2>&1 | tee /mnt/attack.log
          echo "===== ATTACK verdict ====="
          grep -iE "crash|pass|fail|timed out" /mnt/attack.log | tail -20 || true

          # Run #4 reported "failed unexpectedly (text diff)" and that was ALL we learned, because
          # the results directory was uploaded from the wrong path. What the test actually printed
          # is the entire result, so read it here rather than depending on the artifact at all.
          RES=$(find /mnt/wk/WebKitBuild -maxdepth 4 -type d -name layout-test-results | head -1)
          echo "===== results dir: ${RES:-<none>} ====="
          ACT=$(find "$RES" -name "*decide-policy-for-response*-actual.txt" 2>/dev/null | head -1)
          DIF=$(find "$RES" -name "*decide-policy-for-response*-diff.txt" 2>/dev/null | head -1)
          echo "===== ACTUAL OUTPUT ====="
          cat "$ACT" 2>/dev/null || echo "(no -actual.txt found)"
          echo "===== DIFF ====="
          cat "$DIF" 2>/dev/null || echo "(no -diff.txt found)"

          # Step logs need a signed-in session; annotations do not. Send the actual output out
          # through one so the result is readable from the run page alone.
          OUT=$(cat "$ACT" 2>/dev/null | cut -c1-300 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=ATTACK actual output::${OUT:-no -actual.txt produced}"

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-poc-logs
          path: |
            /mnt/deps.log
            /mnt/build.log
            /mnt/control.log
            /mnt/attack.log
            /mnt/wk/WebKitBuild/GTK/Release/layout-test-results/**
          if-no-files-found: warn

      - name: Fail the run if the build never finished
        if: steps.check.outputs.built != 'yes'
        run: exit 1
